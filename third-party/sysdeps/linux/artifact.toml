[options]
unmatched_exclude = [
  "lib/rocm_sysdeps/share/locale/**",
  "lib/rocm_sysdeps/share/man/**",
]

# bzip2
[components.dev."third-party/sysdeps/linux/bzip2/build/stage"]
optional = true
# Include the executables in the dev package since some sub-projects
# require them.
include = [
  "**/bin/*"
]
[components.lib."third-party/sysdeps/linux/bzip2/build/stage"]
optional = true

# elfutils
[components.lib."third-party/sysdeps/linux/elfutils/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/elfutils/build/stage"]
optional = true

# libbacktrace
# Required by amd-dbgapi library.
[components.lib."third-party/sysdeps/linux/libbacktrace/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/libbacktrace/build/stage"]
optional = true

# libcap
[components.lib."third-party/sysdeps/linux/libcap/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/libcap/build/stage"]
optional = true

# libdrm
[components.lib."third-party/sysdeps/linux/libdrm/build/stage"]
include = [
  "**/share/**",
]
optional = true
[components.dev."third-party/sysdeps/linux/libdrm/build/stage"]
optional = true

# libiberty
[components.lib."third-party/sysdeps/linux/libiberty/build/stage"]
[components.dev."third-party/sysdeps/linux/libiberty/build/stage"]

# liblzma
[components.lib."third-party/sysdeps/linux/liblzma/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/liblzma/build/stage"]
optional = true

# libmnl
[components.lib."third-party/sysdeps/linux/libmnl/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/libmnl/build/stage"]
optional = true

# libnl
[components.lib."third-party/sysdeps/linux/libnl/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/libnl/build/stage"]
optional = true

# numactl
[components.lib."third-party/sysdeps/linux/numactl/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/numactl/build/stage"]
optional = true

# sqlite3
[components.lib."third-party/sysdeps/linux/sqlite3/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/sqlite3/build/stage"]
optional = true

# zlib
[components.lib."third-party/sysdeps/linux/zlib/build/stage"]
[components.dev."third-party/sysdeps/linux/zlib/build/stage"]

# zstd
[components.lib."third-party/sysdeps/linux/zstd/build/stage"]
optional = true
[components.dev."third-party/sysdeps/linux/zstd/build/stage"]
optional = true
